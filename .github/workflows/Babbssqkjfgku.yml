name: Extract All Server Requests & Auth Flows

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scan Smali files for Server Requests & Auth
        run: |
          OUT="SERVER_REQUESTS.md"
          echo "# Cartographie des requêtes serveur et flux Auth Oculus" > $OUT
          echo "Généré le $(date)" >> $OUT
          echo "" >> $OUT

          echo "## 1. Endpoints REST et URLs détectées" >> $OUT
          echo "\`\`\`" >> $OUT
          grep -rnE "https?://[a-zA-Z0-9./_-]+" smali/ | cut -d: -f2- | sort -u | head -n 200 >> $OUT || true
          echo "\`\`\`" >> $OUT

          echo "## 2. Endpoints d'Authentification (OAuth, Login, Token)" >> $OUT
          echo "\`\`\`" >> $OUT
          grep -rnE "oauth|login|access_token|auth_token|session|user_checks|device_auth" smali/ >> $OUT || true
          echo "\`\`\`" >> $OUT

          echo "## 3. Requêtes GraphQL & doc_id" >> $OUT
          echo "\`\`\`" >> $OUT
          grep -rnE "doc_id|query\s+|graphql" smali/ >> $OUT || true
          echo "\`\`\`" >> $OUT

          echo "## 4. Activités d'Authentification et WebViews (Origine des popups)" >> $OUT
          echo "\`\`\`" >> $OUT
          grep -rnE "AuthActivity|LoginActivity|WebAuth|OAuth2|authorize" smali/ >> $OUT || true
          echo "\`\`\`" >> $OUT

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SERVER_REQUESTS.md
          git commit -m "Extract server requests and auth flows" || exit 0
          git push
