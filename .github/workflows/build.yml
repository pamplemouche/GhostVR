name: Decompile APKs

on:
  push:
    paths:
      - 'compiled/*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Decompile APKs
        run: |
          mkdir -p decompiled
          for apk in compiled/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk" .apk)
              echo "Decompiling $filename..."
              apktool d "$apk" -o "decompiled/$filename" -f
            fi
          done

      - name: Commit and Push decompiled files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add decompiled/
          git commit -m "chore: auto-decompile APKs from /compiled" || exit 0
          git push origin HEAD:${{ github.ref_name }}
